name: Build and push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Gitea registry
        run: echo "${{ secrets.GITEA_REGISTRY_TOKEN }}" | docker login git.casteel.pw -u ccasteel --password-stdin

      - name: Build and push
        run: make push

      - name: Clean up old image tags
        env:
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
        run: bash .github/scripts/cleanup-tags.sh
