# Copy to secret.yaml, fill in real values, and apply out-of-band:
#   kubectl apply -f k8s/secret.yaml
# Do NOT commit the filled-in secret.yaml to source control.
apiVersion: v1
kind: Secret
metadata:
  name: beansleycoffee-secrets
type: Opaque
stringData:
  SESSION_SECRET: "replace-with-a-long-random-string"
  # SMTP_USER/SMTP_PASS are optional here — can also be set later from the
  # admin Settings page (stored in the DB, takes precedence over these).
  SMTP_USER: "your-gmail-address@gmail.com"
  SMTP_PASS: "your-gmail-app-password"
  BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-a-strong-password"
