apiVersion: apps/v1
kind: Deployment
metadata:
  name: beansleycoffee
spec:
  replicas: 1
  # SQLite is single-writer, and the PVC is ReadWriteOnce — Recreate avoids the
  # rollout scheduling a second pod before the first one (and its volume mount)
  # is torn down.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beansleycoffee
  template:
    metadata:
      labels:
        app: beansleycoffee
    spec:
      # The image runs as the non-root "node" user (uid/gid 1000). fsGroup
      # asks the kubelet to chown the PVC to that group on mount, but plenty
      # of provisioners (local-path-provisioner on k3s/k3d being a common
      # one) don't actually honor it, leaving the volume root:root and the
      # app unable to open its SQLite file (SQLITE_CANTOPEN). The init
      # container below is the reliable fix: it runs as root once, chowns
      # /data, then exits — belt-and-suspenders alongside fsGroup, which
      # still helps on provisioners that do support it.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: beansleycoffee
          image: beansleycoffee:latest # replace with your registry image
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: beansleycoffee-config
            - secretRef:
                name: beansleycoffee-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: beansleycoffee-data
